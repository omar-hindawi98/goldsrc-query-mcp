name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  AGENT_MODEL_NAME: llama3.2:1b

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.AGENT_MODEL_NAME }}

      - name: Start services
        run: docker compose up -d cstrike ollama

      - name: Pull Ollama model
        run: docker compose exec ollama ollama pull ${{ env.AGENT_MODEL_NAME }}

      - name: Wait for cstrike
        run: |
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 27015 2>/dev/null && echo "cstrike ready." && break
            [ "$i" -eq 30 ] && { docker compose logs cstrike; exit 1; }
            sleep 2
          done

      - name: Wait for Ollama
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && echo "Ollama ready." && break
            [ "$i" -eq 30 ] && { docker compose logs ollama; exit 1; }
            sleep 2
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build MCP server
        run: npm ci && npm run build

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run e2e tests
        run: uv run pytest tests/e2e/ -v
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          AGENT_MODEL_NAME: ${{ env.AGENT_MODEL_NAME }}

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
